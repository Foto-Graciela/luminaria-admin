<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Luminaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#04030a;--panel:#0f0a1c;--tarjeta:#150e26;
  --rosa:#c76fa6;--violeta:#6b4a9e;--azul:#2c3f85;
  --luz:#f3eef8;--tenue:#a294b6;--linea:rgba(199,111,166,.20);
  --alerta:#e0894f;--bien:#8ecfa4;
  --display:'Cormorant Garamond',serif;--texto:'Jost',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--noche);color:var(--luz);font-family:var(--texto);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}

/* ---------- acceso ---------- */
.acceso{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--noche);padding:24px}
.acceso.fuera{display:none}
.acceso img{width:170px;opacity:.9}
.acceso input{background:rgba(255,255,255,.05);border:1px solid var(--linea);border-radius:100px;padding:14px 24px;color:var(--luz);text-align:center;letter-spacing:.2em;width:min(280px,100%)}
.acceso input:focus{outline:none;border-color:var(--rosa)}
.acceso button{background:linear-gradient(100deg,var(--rosa),var(--violeta));border:none;color:#fff;border-radius:100px;padding:14px 40px;letter-spacing:.2em;text-transform:uppercase;font-size:.74rem;cursor:pointer}
.acceso .err{color:#e08a8a;font-size:.82rem;min-height:1.2em}

/* ---------- estructura ---------- */
.tapa{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;background:rgba(4,3,10,.9);backdrop-filter:blur(12px);z-index:20}
.tapa img{height:30px}
.tapa .t{font-family:var(--display);font-size:1.15rem}
.tapa .refrescar{margin-left:auto;background:rgba(255,255,255,.04);border:1px solid var(--linea);color:var(--tenue);border-radius:100px;padding:8px 18px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.tapa .refrescar:hover{color:var(--luz)}

.marco{display:grid;grid-template-columns:1fr 380px;gap:0;height:calc(100vh - 60px)}
@media(max-width:900px){
  .marco{grid-template-columns:1fr;height:auto}
  .lado{border-left:none!important;border-top:1px solid rgba(255,255,255,.07)}
}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;min-height:0}
.hilo{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px;min-height:340px}
.hilo::-webkit-scrollbar{width:5px}
.hilo::-webkit-scrollbar-thumb{background:rgba(199,111,166,.3);border-radius:10px}
.m{max-width:74%;padding:13px 17px;border-radius:16px;font-size:.94rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.m.ia{background:var(--tarjeta);border:1px solid rgba(255,255,255,.06);border-bottom-left-radius:5px;align-self:flex-start}
.m.yo{background:linear-gradient(120deg,var(--rosa),var(--violeta));border-bottom-right-radius:5px;align-self:flex-end;color:#fff}
.m.err{background:rgba(199,80,80,.12);border:1px solid rgba(199,80,80,.3);color:#f0c9c9;align-self:flex-start;font-size:.86rem}
.m b{font-weight:500}
.hechas{align-self:flex-start;font-size:.72rem;color:var(--bien);letter-spacing:.06em;padding-left:6px}
.hechas span{display:block}
.puntos{display:flex;gap:5px;align-self:flex-start;padding:14px 18px;background:var(--tarjeta);border-radius:16px}
.puntos i{width:6px;height:6px;border-radius:50%;background:var(--rosa);animation:late 1.3s infinite}
.puntos i:nth-child(2){animation-delay:.18s}.puntos i:nth-child(3){animation-delay:.36s}
@keyframes late{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

.atajos{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 12px}
.atajos button{background:rgba(199,111,166,.09);border:1px solid var(--linea);color:var(--luz);border-radius:100px;padding:8px 14px;font-size:.76rem;cursor:pointer}
.atajos button:hover{background:rgba(199,111,166,.2)}

.escribir{display:flex;gap:10px;padding:16px 24px;border-top:1px solid rgba(255,255,255,.07);align-items:flex-end}
.escribir textarea{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--linea);border-radius:20px;padding:12px 18px;color:var(--luz);font-size:.94rem;resize:none;max-height:130px;line-height:1.5}
.escribir textarea:focus{outline:none;border-color:var(--rosa)}
.escribir button{width:44px;height:44px;flex:none;border-radius:50%;border:none;background:linear-gradient(140deg,var(--rosa),var(--violeta));cursor:pointer;display:flex;align-items:center;justify-content:center}
.escribir button:disabled{opacity:.4}
.escribir svg{width:19px;height:19px;fill:#fff}

/* ---------- tablero ---------- */
.lado{border-left:1px solid rgba(255,255,255,.07);overflow-y:auto;padding:22px;background:var(--panel)}
.lado h3{font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--rosa);font-weight:400;margin-bottom:14px}
.cliente{background:var(--tarjeta);border:1px solid rgba(255,255,255,.06);border-left:3px solid var(--tenue);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.cliente.urge{border-left-color:var(--alerta)}
.cliente.listo{border-left-color:var(--bien)}
.cliente .arriba{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cliente .id{font-size:.66rem;letter-spacing:.16em;color:var(--tenue)}
.cliente .nom{font-family:var(--display);font-size:1.12rem}
.cliente .meta{font-size:.78rem;color:var(--tenue);margin-top:5px;line-height:1.55}
.cliente{cursor:pointer;transition:border-color .2s,transform .2s}
.cliente:hover{transform:translateX(-2px);border-color:var(--linea)}
.cliente .etapa{display:inline-block;margin-top:9px;font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--linea);border-radius:100px;padding:3px 11px;color:var(--luz)}
.cliente.urge .etapa{border-color:var(--alerta);color:var(--alerta)}
.cliente .ver{display:inline-block;margin:9px 0 0 8px;font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;color:var(--alerta);border-bottom:1px solid var(--alerta)}
.cliente .ver:hover{color:var(--luz);border-color:var(--luz)}
.vacio{color:var(--tenue);font-size:.86rem;padding:14px 0}
</style>
</head>
<body>

<!-- ACCESO -->
<div class="acceso" id="acceso">
  <img src="logo-vertical.png" alt="Luminaria">
  <input type="password" id="pin" placeholder="PIN" autocomplete="current-password">
  <button id="btn-entrar">Entrar</button>
  <p class="err" id="err-acceso"></p>
</div>

<div class="tapa">
  <img src="logo-horizontal.png" alt="Luminaria">
  <span class="t">Panel de operación</span>
  <button class="refrescar" id="btn-reporte">Reporte de hoy</button>
</div>

<div class="marco">
  <div class="chat">
    <div class="hilo" id="hilo" aria-live="polite"></div>
    <div class="atajos" id="atajos">
      <button type="button">¿Qué está pendiente?</button>
      <button type="button">¿Qué eventos vienen esta semana?</button>
      <button type="button">¿Hay comprobantes por verificar?</button>
      <button type="button">Ya verifiqué un pago</button>
    </div>
    <div class="escribir">
      <textarea id="entrada" rows="1" placeholder="Escribe aquí..." aria-label="Mensaje"></textarea>
      <button id="enviar" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M3 20.5L21 12 3 3.5 3 10l12 2-12 2z"/></svg></button>
    </div>
  </div>

  <aside class="lado">
    <h3>Clientes activos</h3>
    <div id="tablero"><p class="vacio">Cargando...</p></div>
  </aside>
</div>

<script>
/* ==========================================================
   Misma URL que usa index.html
   ========================================================== */
const API_AGENTE = "https://script.google.com/macros/s/AKfycbxWSXL687uJlll7xHsTpJjHCt_iXUADSQcrz7bVvbxzRgnHQjMKREiJ9vFwXp3KybGt5g/exec";

(function(){
  var acceso  = document.getElementById("acceso");
  var pinCampo= document.getElementById("pin");
  var errAcc  = document.getElementById("err-acceso");
  var hilo    = document.getElementById("hilo");
  var entrada = document.getElementById("entrada");
  var enviar  = document.getElementById("enviar");
  var atajos  = document.getElementById("atajos");
  var tablero = document.getElementById("tablero");

  var PIN = "";
  var historial = [];
  var ocupado = false;

  var URGENTES = ["Comprobante recibido", "Por confirmar pago"];

  /* ---------- pintar ---------- */
  function pinta(texto, clase){
    var d = document.createElement("div");
    d.className = "m " + clase;
    d.innerHTML = texto
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    hilo.appendChild(d);
    hilo.scrollTop = hilo.scrollHeight;
  }

  function pintaHechas(lista){
    if (!lista || !lista.length) return;
    var d = document.createElement("div");
    d.className = "hechas";
    lista.forEach(function(x){
      var s = document.createElement("span");
      s.textContent = "✓ " + x;
      d.appendChild(s);
    });
    hilo.appendChild(d);
    hilo.scrollTop = hilo.scrollHeight;
  }

  function puntos(){
    var d = document.createElement("div");
    d.className = "puntos";
    d.innerHTML = "<i></i><i></i><i></i>";
    hilo.appendChild(d);
    hilo.scrollTop = hilo.scrollHeight;
    return d;
  }

  function fechaCorta(v){
    if (!v) return "";
    var d = new Date(v);
    return isNaN(d) ? String(v) : d.toLocaleDateString("es-MX",{day:"2-digit",month:"short"});
  }

  function pintaTablero(lista){
    tablero.innerHTML = "";
    var activos = (lista||[]).filter(function(c){
      return c.Estado !== "Cerrado" && c.Estado !== "Perdido";
    });
    if (!activos.length){
      tablero.innerHTML = '<p class="vacio">Sin clientes activos.</p>';
      return;
    }
    activos.sort(function(a,b){
      return (URGENTES.indexOf(b.Estado) - URGENTES.indexOf(a.Estado));
    });
    activos.forEach(function(c){
      var urge = URGENTES.indexOf(c.Estado) > -1;
      var d = document.createElement("div");
      d.className = "cliente" + (urge ? " urge" : (c.Estado === "Entregado" ? " listo" : ""));
      d.innerHTML =
        '<div class="arriba"><span class="nom"></span><span class="id"></span></div>' +
        '<div class="meta"></div>' +
        '<span class="etapa"></span>';
      d.querySelector(".nom").textContent = c.Nombre || "Sin nombre";
      d.querySelector(".id").textContent = c.ID;
      d.querySelector(".meta").textContent =
        [c.Evento, fechaCorta(c["Fecha evento"]), c.Paquete,
         c.Total ? "$" + c.Total : "", c["Teléfono"]].filter(String).join(" · ");
      d.querySelector(".etapa").textContent = c.Estado || "";

      if (c.Comprobante){
        var liga = document.createElement("a");
        liga.className = "ver";
        liga.href = c.Comprobante;
        liga.target = "_blank";
        liga.rel = "noopener";
        liga.textContent = "Ver comprobante";
        liga.addEventListener("click", function(ev){ ev.stopPropagation(); });
        d.querySelector(".etapa").insertAdjacentElement("afterend", liga);
      }

      // clic en la ficha: le preguntas a LUC-IA por ese cliente
      d.addEventListener("click", function(){
        manda("Cuéntame de " + c.ID + ": en qué va y qué falta.");
      });

      tablero.appendChild(d);
    });
  }

  /* ---------- llamada ---------- */
  function manda(texto, silencioso){
    if (ocupado) return;
    if (!silencioso){
      if (!texto || !texto.trim()) return;
      pinta(texto, "yo");
      historial.push({rol:"usuario", texto:texto});
      entrada.value = "";
      entrada.style.height = "auto";
    }
    ocupado = true;
    enviar.disabled = true;
    var p = puntos();

    fetch(API_AGENTE, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ modo:"panel", pin:PIN, historial: historial })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      p.remove();
      if (d.error === "pin"){
        pinta("PIN incorrecto, o se bloqueó por muchos intentos.", "err");
        acceso.classList.remove("fuera");
        return;
      }
      if (d.error){
        pinta("El servidor respondió con un error:\n\n" + d.error, "err");
        return;
      }
      if (!d.respuesta) throw new Error("sin respuesta");
      pinta(d.respuesta, "ia");
      historial.push({rol:"agente", texto:d.respuesta});
      pintaHechas(d.hechas);
      pintaTablero(d.tablero);
    })
    .catch(function(e){
      p.remove();
      pinta("No llegué al servidor.\n\nDetalle: " + (e && e.message ? e.message : e) +
            "\n\nSi dice 'Failed to fetch', es que el Apps Script no está publicado " +
            "para 'Cualquier persona'.", "err");
    })
    .finally(function(){
      ocupado = false;
      enviar.disabled = false;
    });
  }

  /* ---------- eventos ---------- */
  function entrar(){
    PIN = pinCampo.value.trim();
    if (!PIN){ errAcc.textContent = "Escribe el PIN."; return; }
    errAcc.textContent = "";
    acceso.classList.add("fuera");
    try { sessionStorage.setItem("pin_luminaria", PIN); } catch(e){}
    manda(null, true);   // arranca pidiendo el reporte del día
  }

  document.getElementById("btn-entrar").addEventListener("click", entrar);
  pinCampo.addEventListener("keydown", function(e){ if (e.key === "Enter") entrar(); });

  document.getElementById("btn-reporte").addEventListener("click", function(){
    manda("Dame el reporte de hoy: qué está pendiente y qué urge.");
  });

  atajos.addEventListener("click", function(e){
    if (e.target.tagName === "BUTTON") manda(e.target.textContent);
  });

  enviar.addEventListener("click", function(){ manda(entrada.value); });
  entrada.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); manda(entrada.value); }
  });
  entrada.addEventListener("input", function(){
    entrada.style.height = "auto";
    entrada.style.height = Math.min(entrada.scrollHeight, 130) + "px";
  });

  // si ya entraste en esta pestaña, no vuelve a pedir el PIN
  try {
    var guardado = sessionStorage.getItem("pin_luminaria");
    if (guardado){ pinCampo.value = guardado; entrar(); }
  } catch(e){}
})();
</script>
</body>
</html>
